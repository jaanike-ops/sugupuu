<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sugupuu v6.1 - Ida</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:#fdfaf7;color:#3a2a2e;overflow:hidden}
  header{height:52px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #f0d6de;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:20}
  .hdr-left{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#5a2e3b;background:#fdf2f5;border:1px solid #f0d6de;border-radius:10px;padding:6px 10px}
  #canvas{position:relative;width:100%;height:calc(100dvh - 52px);background:radial-gradient(#f0d6de 1px,transparent 1px) 0 0/22px 22px;background-color:#fdfaf7;overflow:hidden}
  #center{position:absolute;left:50%;top:50%;width:0;height:0}
  /* IDA box 150x80 pink gradient border #f0a0c3 */
  .ida-box{position:absolute;left:-75px;top:-40px;width:150px;height:80px;background:linear-gradient(180deg,#ffe0f0 0%,#ffcfe6 100%);border:1px solid #f0a0c3;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;text-align:center;box-shadow:0 2px 10px rgba(180,120,130,.12);z-index:5}
  .ida-name{font-size:12px;font-weight:800;line-height:1.15;color:#4a2a34}
  .ida-info{font-size:10px;line-height:1.2;margin-top:3px;color:#7a4a58;font-weight:600}
  /* Plus button 32px white gold #e8b44a gap 8px */
  .plus-btn{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:32px;height:32px;border-radius:999px;background:#fff;border:2px solid #e8b44a;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#b07a1a;cursor:pointer;z-index:6}
  /* 8 action buttons around fixed positions without ring/lines */
  .act-btn{position:absolute;width:124px;height:36px;border-radius:10px;border:1px solid #e9c5d1;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:12px;font-weight:600;color:#4a2a34;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .act-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.14)}
  .act-btn.isa{background:#e0f0ff;border-color:#a0d0f0;left:-152px;top:-103px}
  .act-btn.ema{background:#ffe0f0;border-color:#f0a0c3;left:28px;top:-103px}
  .act-btn.vend{left:-212px;top:-38px}
  .act-btn.ode{left:-212px;top:12px}
  .act-btn.kaasa{left:88px;top:-18px}
  .act-btn.poeg{left:-132px;top:67px}
  .act-btn.tutar{left:8px;top:67px}
  .act-btn.loobu{left:-62px;top:112px;background:#fff7e6;border-color:#e8b44a}
  /* Seos modal */
  #seosOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  #seosOverlay.open{display:flex}
  .seos-box{width:100%;max-width:360px;background:#fff;border-radius:20px;border:1px solid #f0d6de;box-shadow:0 16px 40px rgba(0,0,0,.2);overflow:hidden}
  .seos-head{padding:20px 20px 0 20px}
  .seos-title{font-size:15px;font-weight:800;color:#5a2e3b}
  .seos-sub{font-size:12px;color:#8a6a74;margin-top:4px}
  .seos-opts{padding:16px 20px;display:flex;flex-direction:column;gap:8px}
  .seos-opt{height:48px;border-radius:12px;border:1px solid #e9c5d1;background:#fff;text-align:left;padding:0 16px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .seos-opt.active{background:#fff0f4;border-color:#f0a0c3;color:#5a2e3b}
  .warn{margin:0 20px;padding:10px 12px;border-radius:12px;background:#ffebeb;border:1px solid #ffcccc;font-size:11px;color:#7a2a2a}
  .seos-foot{padding:12px;border-top:1px solid #f0d6de;display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;height:40px;border-radius:999px;border:1px solid #e9c5d1;background:#fff;font-weight:600;font-size:13px;cursor:pointer}
  .btn.primary{background:#5a2e3b;color:#fff;border-color:#5a2e3b}
  footer{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:#b89aa2;letter-spacing:.02em}
</style>
</head>
<body>
<header>
  <div class="hdr-left">◀ Lisa pereliikmeid</div>
  <div style="font-size:11px;background:#5a2e3b;color:#fff;padding:6px 12px;border-radius:999px">Puu (1)</div>
</header>
<div id="canvas">
  <div id="center">
    <div class="ida-box" id="idaBox">
      <div class="ida-name">Ida Raudsepp<br>(Penkowski)</div>
      <div class="ida-info">24 märts 1941 Klassino</div>
    </div>
    <button class="plus-btn" id="plusBtn" title="Lisa pereliige">+</button>
    <button class="act-btn isa" data-type="isa">Lisa isa</button>
    <button class="act-btn ema" data-type="ema">Lisa ema</button>
    <button class="act-btn vend" data-type="vend">Lisa vend</button>
    <button class="act-btn ode" data-type="õde">Lisa õde</button>
    <button class="act-btn kaasa" data-type="mees/naine">Lisa mees/naine</button>
    <button class="act-btn poeg" data-type="poeg">Lisa poeg</button>
    <button class="act-btn tutar" data-type="tütar">Lisa tütar</button>
    <button class="act-btn loobu" data-type="loobu">Loobu</button>
  </div>
  <footer>v6.1 – parandatud overlapping • Ida 150×80 • Loobu väljas • Plus 8px vahe • Ilma fotota</footer>
</div>

<div id="seosOverlay">
  <div class="seos-box">
    <div class="seos-head">
      <div class="seos-title">Vali seos</div>
      <div class="seos-sub" id="seosSub">Kuidas on isa seotud?</div>
    </div>
    <div class="seos-opts">
      <button class="seos-opt active" data-seos="Pärisvanemad"><span>Pärisvanemad</span><span>✓</span></button>
      <button class="seos-opt" data-seos="Lapsendajad"><span>Lapsendajad</span><span></span></button>
      <button class="seos-opt" data-seos="Kasuvanemad"><span>Kasuvanemad</span><span></span></button>
    </div>
    <div class="warn">Valik salvestatakse ja aken sulgub automaatselt. #ffebeb hoiatus näide.</div>
    <div class="seos-foot">
      <button class="btn" id="seosLoobu">Loobu</button>
      <button class="btn primary" id="seosKinnita">Kinnita</button>
    </div>
  </div>
</div>

<script>
const overlay=document.getElementById('seosOverlay');
const sub=document.getElementById('seosSub');
let currentType=null;
function openSeos(type){
  currentType=type;
  sub.textContent='Kuidas on '+type+' seotud?';
  overlay.classList.add('open');
}
function closeSeos(){
  overlay.classList.remove('open');
  currentType=null;
}
document.querySelectorAll('.act-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    const t=b.dataset.type;
    if(t==='isa'||t==='ema'){ openSeos(t); }
    else if(t==='loobu'){ closeSeos(); alert('Loobu vajutatud - jäi Ida juurde'); }
    else { alert(t+' lisamine - avaneb vorm (demo)'); }
  });
});
document.getElementById('plusBtn').addEventListener('click',()=>{ alert('Lisa pereliige - plus 32px valge kuld #e8b44a 8px vahe'); });
document.getElementById('seosLoobu').addEventListener('click',closeSeos);
document.getElementById('seosKinnita').addEventListener('click',closeSeos);
overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeSeos(); });
document.querySelectorAll('.seos-opt').forEach(opt=>{
  opt.addEventListener('click',()=>{
    document.querySelectorAll('.seos-opt').forEach(o=>{o.classList.remove('active'); o.querySelector('span:last-child').textContent='';});
    opt.classList.add('active');
    opt.querySelector('span:last-child').textContent='✓';
    setTimeout(()=>{ closeSeos(); }, 250);
  });
});
</script>
</body>
</html>
