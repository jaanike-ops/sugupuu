<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugupuu - Jaanike</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fdfaf3;--paper2:#f5efe1;--ink:#2b1a20;--gold:#e8b44a;--line:#e8ddd0;--card:#ffffff;}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;}
h1,h2{font-family:'Instrument Serif',serif;}
.header{position:sticky;top:0;z-index:10;background:rgba(253,250,243,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:12px}.logo-icon{width:40px;height:40px;background:var(--ink);color:var(--gold);display:grid;place-items:center;border-radius:12px;font-family:'Instrument Serif';font-size:22px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-width:240px}
.search input{border:0;outline:0;background:transparent;width:100%;font:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;font:500 14px 'Plus Jakarta Sans';cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.canvas-wrap{position:relative;width:100%;height:calc(100vh - 70px);overflow:hidden;cursor:grab}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.tree{display:flex;flex-direction:column;align-items:center;gap:48px;padding:80px}
.gen{display:flex;gap:32px;justify-content:center;flex-wrap:nowrap}
.card{width:200px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(43,26,32,0.06);cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(43,26,32,0.1);border-color:var(--gold)}
.card.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.avatar{width:56px;height:56px;border-radius:16px;background:var(--paper2);display:grid;place-items:center;font-family:'Instrument Serif';font-size:22px;margin-bottom:10px}
.meta{font-size:12px;color:#8a7a6e}.name{font-weight:600;font-size:15px;margin:2px 0}
.couple{display:flex;gap:16px;align-items:center;position:relative}
.couple::after{content:'♥';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border:1px solid var(--line);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--gold)}
.side{position:fixed;right:20px;top:90px;width:360px;max-height:calc(100vh - 110px);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;overflow:auto;box-shadow:0 24px 48px rgba(0,0,0,0.12);z-index:20}
.side h2{margin:0 0 12px;font-size:28px}
.field{margin-bottom:12px}.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7a6e;display:block;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--paper)}
.toolbar{position:fixed;left:20px;bottom:20px;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:15}
.filters{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;background:var(--ink);border-radius:999px;padding:6px;z-index:15}
.filters button{border:0;background:transparent;color:var(--paper2);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.filters button.active{background:var(--card);color:var(--ink)}
@media(max-width:800px){.side{left:10px;right:10px;width:auto;top:auto;bottom:80px;max-height:58vh;border-radius:28px 28px 0 0}.toolbar{bottom:90px}.header{padding:10px 14px}}
svg.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
</style>
</head>
<body>
<div class="header">
<div class="logo"><div class="logo-icon">J</div><div><h1 style="margin:0;font-size:22px;line-height:1">Sugupuu</h1><div style="font-size:12px;color:#8a7a6e">jaanike-ops / sugupuu</div></div></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div class="search"><span>🔍</span><input id="q" placeholder="Otsi nime..."></div>
<button class="btn" onclick="exportJSON()">Ekspordi</button>
<button class="btn" onclick="document.getElementById('importFile').click()">Impordi</button>
<input id="importFile" type="file" hidden accept=".json" onchange="importJSON(event)">
<button class="btn primary" onclick="openNew()">+ Lisa isik</button>
</div>
</div>
<div class="canvas-wrap" id="wrap">
<div class="canvas" id="canvas">
<svg class="lines" id="lines"></svg>
<div class="tree" id="tree"></div>
</div>
</div>
<div class="toolbar">
<button class="btn" onclick="zoom(0.15)">+</button>
<button class="btn" onclick="zoom(-0.15)">-</button>
<button class="btn" onclick="resetView()">Keskenda</button>
</div>
<div class="filters"><button class="active" onclick="setFilter('all',this)">Kõik</button><button onclick="setFilter('3gen',this)">3 põlvkonda</button><button onclick="setFilter('my',this)">Minu liin</button></div>
<div class="side" id="side" style="display:none"></div>
<script>
const LS='sugupuu_v2';
let persons=[
{id:'p1',nimi:'Jaan Tamm',sugu:'M',synd:'1920-05-12',koht:'Viljandi',surm:'1998-02-03',lugu:'Põllumees ja külavanem. Armastas lõõtspilli.',vanemad:[],partner:['p2']},
{id:'p2',nimi:'Leida Tamm',sugu:'N',synd:'1923-08-04',koht:'Suure-Jaani',surm:'2005-11-19',lugu:'Õpetaja, hoidis pere koos.',vanemad:[],partner:['p1']},
{id:'p3',nimi:'Tiit Tamm',sugu:'M',synd:'1948-03-21',koht:'Viljandi',lugu:'Insener. Ehitas ise maja.',vanemad:['p1','p2'],partner:['p4']},
{id:'p4',nimi:'Sirje Tamm',sugu:'N',synd:'1950-09-11',koht:'Tartu',lugu:'Raamatukoguhoidja.',vanemad:[],partner:['p3']},
{id:'p5',nimi:'Peeter Tamm',sugu:'M',synd:'1975-06-15',koht:'Tallinn',lugu:'IT ja sugupuu uurija - sina?',vanemad:['p3','p4'],partner:['p6']},
{id:'p6',nimi:'Kristiina Kask',sugu:'N',synd:'1978-02-28',koht:'Pärnu',lugu:'Disainer.',vanemad:[],partner:['p5']},
{id:'p7',nimi:'Oskar Tamm',sugu:'M',synd:'2008-11-03',koht:'Helsinki',lugu:'Koolipoiss, armastab jalgpalli.',vanemad:['p5','p6'],partner:[]},
{id:'p8',nimi:'Mia Tamm',sugu:'N',synd:'2011-04-19',koht:'Helsinki',lugu:'Armastab joonistada.',vanemad:['p5','p6'],partner:[]},
{id:'p9',nimi:'Liis Tamm',sugu:'N',synd:'1973-01-10',koht:'Viljandi',lugu:'Arst.',vanemad:['p3','p4'],partner:[]},
];
try{const s=localStorage.getItem(LS);if(s){persons=JSON.parse(s)}}catch(e){}
let selected=null,filter='all',scale=1,tx=0,ty=0,isDrag=false,startX,startY;
const treeEl=document.getElementById('tree'),linesEl=document.getElementById('lines'),canvasEl=document.getElementById('canvas'),wrap=document.getElementById('wrap'),side=document.getElementById('side');
function save(){localStorage.setItem(LS,JSON.stringify(persons))}
function getById(id){return persons.find(p=>p.id===id)}
function initials(n){return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function render(){
treeEl.innerHTML='';linesEl.innerHTML='';
let filtered=persons;
if(filter==='3gen'){filtered=persons.filter(p=>['p1','p2','p3','p4','p5','p6','p7','p8','p9'].includes(p.id))}
if(filter==='my'){filtered=persons.filter(p=>['p1','p3','p5','p7'].includes(p.id) || p.id==='p2')}
const q=document.getElementById('q').value.toLowerCase();
if(q){filtered=filtered.filter(p=>p.nimi.toLowerCase().includes(q))}
const gens={};
filtered.forEach(p=>{
let d=0;let cur=p;while(cur.vanemad && cur.vanemad.length){let par=getById(cur.vanemad[0]);if(!par)break;d++;cur=par;if(d>10)break}
if(!gens[d])gens[d]=[];gens[d].push(p)
});
Object.keys(gens).sort((a,b)=>a-b).forEach(k=>{
const genDiv=document.createElement('div');genDiv.className='gen';
gens[k].forEach(p=>{
if(p.partner && p.partner[0] && filtered.find(x=>x.id===p.partner[0]) && gens[k].includes(getById(p.partner[0]))){
const partner=getById(p.partner[0]);
if(partner && p.id<partner.id){
const couple=document.createElement('div');couple.className='couple';
couple.appendChild(card(p));couple.appendChild(card(partner));
genDiv.appendChild(couple);
}else if(!partner || !gens[k].some(x=>x.id===partner.id)){
genDiv.appendChild(card(p));
}
}else if(!gens[k].some(other=>other.partner && other.partner.includes(p.id) && other.id < p.id)){
genDiv.appendChild(card(p));
}
});
treeEl.appendChild(genDiv);
});
setTimeout(drawLines,50);
}
function card(p){
const d=document.createElement('div');d.className='card'+(selected===p.id?' selected':'');d.onclick=()=>select(p.id);
d.innerHTML=`<div class="avatar">${initials(p.nimi)}</div><div class="name">${p.nimi}</div><div class="meta">${p.sugu==='M'?'♂':'♀'} ${p.synd||''} ${p.koht?'· '+p.koht:''}</div><div class="meta" style="margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.lugu||''}</div>`;
d.id='card-'+p.id;return d;
}
function drawLines(){
linesEl.innerHTML='';
const allCards=document.querySelectorAll('.card');
allCards.forEach(c=>{
const p=getById(c.id.replace('card-',''));
if(!p||!p.vanemad||!p.vanemad.length)return;
p.vanemad.forEach(pid=>{
const parCard=document.getElementById('card-'+pid);
if(!parCard)return;
const r1=parCard.getBoundingClientRect(),r2=c.getBoundingClientRect(),cr=canvasEl.getBoundingClientRect();
const x1=r1.left+r1.width/2-cr.left,y1=r1.top+r1.height-cr.top;
const x2=r2.left+r2.width/2-cr.left,y2=r2.top-cr.top;
const path=document.createElementNS('http://www.w3.org/2000/svg','path');
path.setAttribute('d',`M ${x1} ${y1} C ${x1} ${y1+40}, ${x2} ${y2-40}, ${x2} ${y2}`);
path.setAttribute('fill','none');path.setAttribute('stroke','#e8ddd0');path.setAttribute('stroke-width','2');
linesEl.appendChild(path);
});
});
}
function select(id){
selected=id;render();
const p=getById(id);if(!p)return;
side.style.display='block';
side.innerHTML=`
<h2>${p.nimi}</h2>
<div class="meta" style="margin-bottom:16px">${p.sugu==='M'?'Mees':'Naine'} · ${p.synd||''} ${p.surm?'– '+p.surm:''}</div>
<div class="field"><label>Nimi</label><input id="e_nimi" value="${p.nimi}"></div>
<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>Sugu</label><select id="e_sugu"><option value="M" ${p.sugu==='M'?'selected':''}>M</option><option value="N" ${p.sugu==='N'?'selected':''}>N</option></select></div><div class="field" style="flex:1"><label>Koht</label><input id="e_koht" value="${p.koht||''}"></div></div>
<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>Sünd</label><input id="e_synd" type="date" value="${p.synd||''}"></div><div class="field" style="flex:1"><label>Surm</label><input id="e_surm" type="date" value="${p.surm||''}"></div></div>
<div class="field"><label>Lugu / märkmed</label><textarea id="e_lugu" rows="3">${p.lugu||''}</textarea></div>
<div class="field"><label>Vanemad (ID koma-ga)</label><input id="e_vanemad" value="${(p.vanemad||[]).join(',')}"></div>
<div class="field"><label>Partner (ID)</label><input id="e_partner" value="${(p.partner||[]).join(',')}"></div>
<div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" onclick="savePerson()">Salvesta</button><button class="btn" onclick="addChild()">+ Laps</button><button class="btn" onclick="delPerson()" style="margin-left:auto;color:#b42318;border-color:#f5c6c0">Kustuta</button></div>
<button class="btn" style="margin-top:12px;width:100%" onclick="closeSide()">Sulge</button>
`;
}
function savePerson(){
if(!selected)return;const p=getById(selected);
p.nimi=document.getElementById('e_nimi').value;
p.sugu=document.getElementById('e_sugu').value;
p.koht=document.getElementById('e_koht').value;
p.synd=document.getElementById('e_synd').value;
p.surm=document.getElementById('e_surm').value;
p.lugu=document.getElementById('e_lugu').value;
p.vanemad=document.getElementById('e_vanemad').value.split(',').map(s=>s.trim()).filter(Boolean);
p.partner=document.getElementById('e_partner').value.split(',').map(s=>s.trim()).filter(Boolean);
save();render();select(selected);
}
function openNew(){
const id='p'+Date.now();
persons.push({id,nimi:'Uus isik',sugu:'M',synd:'',koht:'',lugu:'',vanemad:[],partner:[]});
save();render();select(id);
}
function delPerson(){
if(!selected)return;if(!confirm('Kustutada?'))return;
persons=persons.filter(p=>p.id!==selected);
persons.forEach(p=>{p.vanemad=p.vanemad.filter(x=>x!==selected);p.partner=p.partner.filter(x=>x!==selected)});
selected=null;side.style.display='none';save();render();
}
function addChild(){
if(!selected)return;
const id='p'+Date.now();persons.push({id,nimi:'Uus laps',sugu:'M',synd:'',koht:'',lugu:'',vanemad:[selected],partner:[]});
save();render();select(id);
}
function closeSide(){side.style.display='none';selected=null;render();}
function setFilter(f,btn){filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function exportJSON(){const blob=new Blob([JSON.stringify(persons,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sugupuu.json';a.click();}
function importJSON(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{persons=JSON.parse(ev.target.result);save();render();}catch{alert('Vigane JSON')}};r.readAsText(file);}
function zoom(d){scale=Math.min(1.6,Math.max(0.4,scale+d));canvasEl.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function resetView(){scale=1;tx=0;ty=0;canvasEl.style.transform=`translate(0px,0px) scale(1)`;drawLines();}
wrap.addEventListener('pointerdown',e=>{isDrag=true;startX=e.clientX-tx;startY=e.clientY-ty;wrap.setPointerCapture(e.pointerId);wrap.style.cursor='grabbing'});
wrap.addEventListener('pointermove',e=>{if(!isDrag)return;tx=e.clientX-startX;ty=e.clientY-startY;canvasEl.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`});
wrap.addEventListener('pointerup',e=>{isDrag=false;wrap.style.cursor='grab';drawLines()});
document.getElementById('q').addEventListener('input',render);
render();setTimeout(resetView,100);
window.addEventListener('resize',drawLines);
</script>
</body>
</html>
